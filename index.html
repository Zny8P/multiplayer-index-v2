<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Multiplayer Battle Royale Prototype</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #111;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100dvh;
      background: #2e6f40;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      pointer-events: none;
    }

    /* ECRÃS / OVERLAYS */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.82);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 500;
    }

    .modal {
      background: #222;
      border: 2px solid #444;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      color: white;
      width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .modal h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 22px;
    }

    .modal input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #111;
      color: white;
      font-size: 16px;
      text-align: center;
      margin-bottom: 20px;
      outline: none;
    }

    .modal button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      background: #28a745;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal button:hover {
      background: #218838;
    }

    #death-screen {
      display: none;
    }

    /* HUD DO JOGADOR LOCAL */
    #hud {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 150;
      pointer-events: none;
    }

    #ammo-container {
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #555;
      border-radius: 8px;
      padding: 6px 16px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
      letter-spacing: 1px;
    }

    #hp-container {
      width: 260px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #555;
      border-radius: 10px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #hp-bar-bg {
      width: 100%;
      height: 18px;
      background: #441111;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    #hp-bar-fill {
      width: 100%;
      height: 100%;
      background: #28a745;
      transition: width 0.15s ease-out;
    }

    #hp-text {
      color: white;
      font-size: 12px;
      font-weight: bold;
      margin-top: 3px;
    }

    /* CONTROLOS MÓVEIS */
    .joystick-container {
      position: fixed;
      bottom: 30px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      display: none;
      z-index: 200;
      touch-action: none;
    }

    #joystick-left { left: 25px; }
    #joystick-right { right: 25px; }

    .joystick-knob {
      position: absolute;
      width: 55px;
      height: 55px;
      left: 37.5px;
      top: 37.5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.8);
      pointer-events: none;
    }

    #fire-btn {
      position: fixed;
      left: 55px;
      bottom: 175px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(220, 53, 69, 0.7);
      border: 3px solid rgba(255, 255, 255, 0.8);
      color: white;
      font-weight: bold;
      font-size: 14px;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 210;
      touch-action: none;
    }

    @media (max-width: 800px), (max-height: 600px) {
      .joystick-container, #fire-btn {
        display: flex;
      }
    }
  </style>
</head>

<body>

  <canvas id="canvas"></canvas>
  <div id="status">A ligar...</div>

  <!-- Ecrã de Login Inicial -->
  <div id="login-screen" class="overlay">
    <div class="modal">
      <h2>Battle Royale</h2>
      <input type="text" id="username-input" placeholder="O seu Nome" maxlength="12">
      <button id="join-btn">Entrar no Jogo</button>
    </div>
  </div>

  <!-- Ecrã de Morte -->
  <div id="death-screen" class="overlay">
    <div class="modal">
      <h2 style="color: #dc3545;">Você Morreu!</h2>
      <button id="respawn-btn">Renascer</button>
    </div>
  </div>

  <!-- HUD do Jogador -->
  <div id="hud">
    <div id="ammo-container">
      <span id="ammo-text">10 / 10</span>
    </div>
    <div id="hp-container">
      <div id="hp-bar-bg">
        <div id="hp-bar-fill"></div>
      </div>
      <div id="hp-text">200 / 200 HP</div>
    </div>
  </div>

  <!-- Controlos Móveis -->
  <div id="joystick-left" class="joystick-container">
    <div id="knob-left" class="joystick-knob"></div>
  </div>

  <div id="joystick-right" class="joystick-container">
    <div id="knob-right" class="joystick-knob"></div>
  </div>

  <div id="fire-btn">TIRO</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

const loginScreen = document.getElementById("login-screen");
const usernameInput = document.getElementById("username-input");
const joinBtn = document.getElementById("join-btn");

const deathScreen = document.getElementById("death-screen");
const respawnBtn = document.getElementById("respawn-btn");

const hpBarFill = document.getElementById("hp-bar-fill");
const hpText = document.getElementById("hp-text");
const ammoText = document.getElementById("ammo-text");

let socket;
let myId = null;
let players = {};
let bullets = [];
let bushes = [];
let particles = [];
let selfState = { hp: 200, maxHp: 200, ammo: 10, maxAmmo: 10, isReloading: false, isDead: false };

let worldWidth = 2000;
let worldHeight = 2000;
const PLAYER_SIZE = 30;

let lastCamX = 0;
let lastCamY = 0;

// Estado dos Controlos Locais
const input = {
  moveX: 0,
  moveY: 0,
  angle: 0,
  shoot: false,
  reload: false
};

let targetMoveX = 0;
let targetMoveY = 0;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function drawRoundedRect(context, x, y, width, height, radius) {
  if (typeof context.roundRect === "function") {
    context.beginPath();
    context.roundRect(x, y, width, height, radius);
    context.fill();
  } else {
    context.fillRect(x, y, width, height);
  }
}

/* ==================================================
   LIGAÇÃO WEBSOCKET
   ================================================== */
function connect(username) {
  if (socket && (socket.readyState === WebSocket.CONNECTING || socket.readyState === WebSocket.OPEN)) {
    return;
  }

  joinBtn.disabled = true;
  joinBtn.textContent = "A entrar...";

  const serverURL = "wss://multiplayer-v2.onrender.com";
  socket = new WebSocket(serverURL);

  socket.onopen = () => {
    status.textContent = "🟢 Ligado";
    socket.send(JSON.stringify({ type: "join", name: username }));
  };

  socket.onclose = () => {
    status.textContent = "🔴 Desligado (a tentar reconectar...)";
    joinBtn.disabled = false;
    joinBtn.textContent = "Entrar no Jogo";
    resetInputs();

    setTimeout(() => { if (username) connect(username); }, 3000);
  };

  socket.onerror = () => {
    status.textContent = "⚠️ Erro de ligação";
    joinBtn.disabled = false;
    joinBtn.textContent = "Entrar no Jogo";
    resetInputs();
    socket.close();
  };

  socket.onmessage = event => {
    try {
      const data = JSON.parse(event.data);

      if (data.type === "init") {
        myId = data.id;
        if (data.world) {
          worldWidth = data.world.width;
          worldHeight = data.world.height;
        }
        if (data.bushes) bushes = data.bushes;
        loginScreen.style.display = "none";
        resetInputs();

        joinBtn.disabled = false;
        joinBtn.textContent = "Entrar no Jogo";
      }

      if (data.type === "state") {
        players = {};
        for (const p of data.players) players[p.id] = p;
        bullets = data.bullets || [];

        if (data.self) {
          selfState = data.self;
          updateHUD(data.self);
          if (data.self.isDead) {
            deathScreen.style.display = "flex";
          } else {
            deathScreen.style.display = "none";
          }
        }
      }
    } catch (err) {
      console.error("Erro ao processar mensagem do servidor:", err);
    }
  };
}

function updateHUD(selfData) {
  const hpPct = Math.max(0, (selfData.hp / selfData.maxHp) * 100);
  hpBarFill.style.width = `${hpPct}%`;
  hpText.textContent = `${selfData.hp} / ${selfData.maxHp} HP`;

  if (selfData.isReloading) {
    ammoText.textContent = "A RECARREGAR...";
    ammoText.style.color = "#ffc107";
  } else {
    ammoText.textContent = `${selfData.ammo} / ${selfData.maxAmmo}`;
    ammoText.style.color = "white";
  }
}

joinBtn.addEventListener("click", () => {
  const name = usernameInput.value.trim() || "Jogador";
  connect(name);
});

respawnBtn.addEventListener("click", () => {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "respawn" }));
    deathScreen.style.display = "none";
  }
});

/* ==================================================
   CONTROLOS (TECLADO, RATO, TOUCH)
   ================================================== */
const keysPressed = {};

function updateKeyboardMovement() {
  let x = 0;
  let y = 0;
  if (keysPressed["a"] || keysPressed["arrowleft"]) x -= 1;
  if (keysPressed["d"] || keysPressed["arrowright"]) x += 1;
  if (keysPressed["w"] || keysPressed["arrowup"]) y -= 1;
  if (keysPressed["s"] || keysPressed["arrowdown"]) y += 1;

  targetMoveX = x;
  targetMoveY = y;
}

document.addEventListener("keydown", e => {
  if (loginScreen.style.display !== "none") return;
  if (document.activeElement === usernameInput) return;
  const k = e.key.toLowerCase();
  keysPressed[k] = true;

  if (k === " ") input.shoot = true;
  if (k === "r") input.reload = true;
  updateKeyboardMovement();
});

document.addEventListener("keyup", e => {
  const k = e.key.toLowerCase();
  keysPressed[k] = false;

  if (k === " ") input.shoot = false;
  if (k === "r") input.reload = false;
  updateKeyboardMovement();
});

window.addEventListener("mousedown", e => {
  if (loginScreen.style.display !== "none") return;
  if (document.activeElement === usernameInput) return;
  if (e.button === 0 && e.target === canvas) {
    input.shoot = true;
  }
});

window.addEventListener("mouseup", e => {
  if (e.button === 0) {
    input.shoot = false;
  }
});

window.addEventListener("mousemove", e => {
  if (loginScreen.style.display !== "none") return;
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  input.angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
});

function updateKeyboardAim() {
  if (keysPressed["q"]) input.angle -= 0.08;
  if (keysPressed["e"]) input.angle += 0.08;
}

/* ==================================================
   GESTOR DE FOCO E PERDA DE CONTROLO
   ================================================== */
let resetLeftJoystick = null;
let resetRightJoystick = null;

function resetInputs() {
  input.moveX = 0;
  input.moveY = 0;
  targetMoveX = 0;
  targetMoveY = 0;
  input.shoot = false;
  input.reload = false;

  for (const k in keysPressed) {
    keysPressed[k] = false;
  }

  if (resetLeftJoystick) resetLeftJoystick();
  if (resetRightJoystick) resetRightJoystick();
}

window.addEventListener("blur", resetInputs);
window.addEventListener("pagehide", resetInputs);
window.addEventListener("pointercancel", resetInputs);
window.addEventListener("touchcancel", resetInputs);

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    resetInputs();
  }
});

/* ==================================================
   JOYSTICKS E BOTÃO FIRE (MÓVEL)
   ================================================== */
function setupJoystick(elementId, knobId, onMove, onReset) {
  const joy = document.getElementById(elementId);
  const knob = document.getElementById(knobId);
  let active = false;
  let activePointerId = null;

  function update(clientX, clientY) {
    const rect = joy.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    let dx = clientX - centerX;
    let dy = clientY - centerY;
    const maxDist = 40;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > maxDist) {
      dx = (dx / dist) * maxDist;
      dy = (dy / dist) * maxDist;
    }

    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    onMove(dx / maxDist, dy / maxDist, dist);
  }

  function reset() {
    active = false;
    if (activePointerId !== null) {
      try { joy.releasePointerCapture(activePointerId); } catch (e) {}
      activePointerId = null;
    }
    knob.style.transform = "translate(0px, 0px)";
    onReset();
  }

  joy.addEventListener("pointerdown", e => {
    if (loginScreen.style.display !== "none") return;
    active = true;
    activePointerId = e.pointerId;
    try { joy.setPointerCapture(e.pointerId); } catch (err) {}
    update(e.clientX, e.clientY);
  });

  joy.addEventListener("pointermove", e => {
    if (loginScreen.style.display !== "none") return;
    if (active) update(e.clientX, e.clientY);
  });

  joy.addEventListener("pointerup", reset);
  joy.addEventListener("pointercancel", reset);
  joy.addEventListener("lostpointercapture", reset);

  return reset;
}

resetLeftJoystick = setupJoystick("joystick-left", "knob-left",
  (nx, ny) => {
    targetMoveX = nx;
    targetMoveY = ny;
  },
  () => { targetMoveX = 0; targetMoveY = 0; }
);

resetRightJoystick = setupJoystick("joystick-right", "knob-right",
  (nx, ny, dist) => {
    if (dist > 5) input.angle = Math.atan2(ny, nx);
  },
  () => {}
);

const fireBtn = document.getElementById("fire-btn");
let firePointerId = null;

function stopFiring(e) {
  if (e) e.preventDefault();
  if (firePointerId !== null) {
    try { fireBtn.releasePointerCapture(firePointerId); } catch (err) {}
    firePointerId = null;
  }
  input.shoot = false;
}

fireBtn.addEventListener("pointerdown", e => {
  if (loginScreen.style.display !== "none") return;
  e.preventDefault();
  input.shoot = true;
  firePointerId = e.pointerId;
  try { fireBtn.setPointerCapture(e.pointerId); } catch (err) {}
});
fireBtn.addEventListener("pointerup", stopFiring);
fireBtn.addEventListener("pointercancel", stopFiring);
fireBtn.addEventListener("lostpointercapture", stopFiring);

/* ==================================================
   ENVIO DE INPUTS (30 FPS)
   ================================================== */
setInterval(() => {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;

  socket.send(JSON.stringify({
    type: "input",
    moveX: input.moveX,
    moveY: input.moveY,
    angle: input.angle,
    shoot: input.shoot,
    reload: input.reload
  }));

  input.reload = false;
}, 1000 / 30);

/* ==================================================
   PARTÍCULAS DOS ARBUSTOS (CORRIGIDAS COM SELFSTATE)
   ================================================== */
let lastParticleTime = 0;
let lastPlayerX = 0;
let lastPlayerY = 0;
let hasLastPosition = false;

function updateBushParticles() {
  const myPlayer = players[myId];
  
  if (!myPlayer || selfState.isDead || myPlayer.inBush === null) {
    hasLastPosition = false;
    lastParticleTime = 0;
    return;
  }

  if (!hasLastPosition) {
    lastPlayerX = myPlayer.x;
    lastPlayerY = myPlayer.y;
    hasLastPosition = true;
    return;
  }

  const movedDist = Math.hypot(myPlayer.x - lastPlayerX, myPlayer.y - lastPlayerY);
  const isActuallyMoving = movedDist > 0.1;

  lastPlayerX = myPlayer.x;
  lastPlayerY = myPlayer.y;

  if (!isActuallyMoving) return;

  const now = Date.now();
  if (now - lastParticleTime < 150) return;
  lastParticleTime = now;

  const px = myPlayer.x + PLAYER_SIZE / 2;
  const py = myPlayer.y + PLAYER_SIZE / 2;
  const angle = Math.random() * Math.PI * 2;
  const offset = Math.random() * 10;

  particles.push({
    x: px + Math.cos(angle) * offset,
    y: py + Math.sin(angle) * offset,
    vx: (Math.random() - 0.5) * 0.8,
    vy: (Math.random() - 0.5) * 0.8,
    size: 2.5 + Math.random() * 2.5,
    color: Math.random() > 0.5 ? "#a2d04a" : "#4d9129",
    life: 1.0
  });
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.04;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* ==================================================
   RENDERIZAÇÃO (CANVAS)
   ================================================== */
function render() {
  updateKeyboardAim();

  input.moveX += (targetMoveX - input.moveX) * 0.6;
  input.moveY += (targetMoveY - input.moveY) * 0.6;

  updateBushParticles();
  updateParticles();

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const myPlayer = players[myId];

  if (myPlayer) {
    lastCamX = (myPlayer.x + PLAYER_SIZE / 2) - canvas.width / 2;
    lastCamY = (myPlayer.y + PLAYER_SIZE / 2) - canvas.height / 2;
  }

  ctx.save();
  ctx.translate(-lastCamX, -lastCamY);

  ctx.fillStyle = "#348247";
  ctx.fillRect(0, 0, worldWidth, worldHeight);

  ctx.strokeStyle = "rgba(0, 0, 0, 0.06)";
  ctx.lineWidth = 2;
  const gridSize = 80;
  for (let x = 0; x <= worldWidth; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, worldHeight); ctx.stroke();
  }
  for (let y = 0; y <= worldHeight; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(worldWidth, y); ctx.stroke();
  }

  ctx.strokeStyle = "#1a4023";
  ctx.lineWidth = 8;
  ctx.strokeRect(0, 0, worldWidth, worldHeight);

  for (const bush of bushes) {
    ctx.save();
    ctx.translate(bush.x, bush.y);

    ctx.fillStyle = "#1e4d2b";
    ctx.beginPath();
    bush.points.forEach((pt, i) => {
      if (i === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    });
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#286639";
    ctx.beginPath();
    bush.points.forEach((pt, i) => {
      const px = pt.x * 0.75;
      const py = pt.y * 0.75;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  for (const b of bullets) {
    ctx.save();
    ctx.fillStyle = "#ffeb3b";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  for (const p of Object.values(players)) {
    const px = p.x + PLAYER_SIZE / 2;
    const py = p.y + PLAYER_SIZE / 2;

    ctx.save();
    ctx.translate(px, py);

    if (p.id === myId && p.inBush !== null) {
      ctx.globalAlpha = 0.4;
    }

    ctx.save();
    ctx.rotate(p.angle);

    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.rect(-PLAYER_SIZE / 2, -PLAYER_SIZE / 2, PLAYER_SIZE, PLAYER_SIZE);
    ctx.fill();

    if (p.id === myId) {
      ctx.strokeStyle = "white";
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(8, -3, 10, 6);
    ctx.restore();

    ctx.font = "bold 12px Arial";
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.fillText(p.name, 0, -PLAYER_SIZE / 2 - 18);

    const barWidth = 36;
    const barHeight = 5;
    const hpPct = Math.max(0, p.hp / p.maxHp);

    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(-barWidth / 2, -PLAYER_SIZE / 2 - 12, barWidth, barHeight);

    ctx.fillStyle = hpPct > 0.5 ? "#28a745" : hpPct > 0.25 ? "#ffc107" : "#dc3545";
    ctx.fillRect(-barWidth / 2, -PLAYER_SIZE / 2 - 12, barWidth * hpPct, barHeight);

    ctx.restore();
  }

  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>

</body>
</html>
